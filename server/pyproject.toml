[project]
name = "onlyvibes-server"
version = "0.1.0"
description = "OnlyVibes server: FastAPI websocket hub (reporters -> viewers), Mistral Small log summarizer, serves the web viewer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
    "httpx>=0.27",
]

[project.scripts]
onlyvibes-server = "main:serve"
