[project]
name = "onlyvibes-server"
version = "0.1.0"
description = "OnlyVibes hub: orchestra server (projects, kanban tasks, worker scheduling, agent API, live board) + legacy reporter/3D view websockets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
    "httpx>=0.27",
]

[project.scripts]
onlyvibes-server = "main:serve"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
