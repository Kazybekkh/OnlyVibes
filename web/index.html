<!DOCTYPE html>
<!--
  OnlyVibes: live orchestration board (main UI).

  Served by the hub at "/" (server serves web/ statically), e.g.
    cd server && uv run uvicorn main:app --host 0.0.0.0 --port 8000   ->  http://<hub>:8000/
  Talks only to the PROTOCOL.md §4 surface: GET /api/state, WS /board, GET /api/tasks/{id},
  POST /api/projects, /api/messages, /api/projects/{id}/tasks, /api/tasks/{id}/{retry,cancel,done}.

  Standalone: open this file directly (file://) or serve web/ with no hub behind it; after 2.5 s
  without an answer the board runs an in-page simulation labelled "Demo data" (web/demo.js).
  URL options: ?demo=1 forces the demo (&speed=N fast-forwards it), ?hub=host:port points the board at another hub
  (that hub must allow CORS). Deep link a task with #task=<task id>.

  The 3D / WebXR table lives in ar.html.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>OnlyVibes · board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="board.css" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="./" aria-label="OnlyVibes board">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>OnlyVibes
  </a>

  <div class="switcher" id="switcher" hidden>
    <button class="switcher-btn" id="project-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="sdot" id="project-dot"></span>
      <span class="switcher-title" id="project-title">No project</span>
      <span class="switcher-meta mono" id="project-meta"></span>
      <svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <ul class="menu" id="project-menu" role="listbox" aria-label="Projects" hidden></ul>
  </div>

  <button class="btn" id="new-product" type="button">New product</button>

  <div class="spacer"></div>

  <span class="conn" id="conn" data-state="connecting" role="status" aria-live="polite">
    <span class="conn-dot"></span><span class="conn-label" id="conn-label">Connecting</span>
  </span>
  <button class="btn ghost rail-toggle" id="rail-toggle" type="button" aria-controls="rail" aria-expanded="false">
    Chatter <span class="badge-count mono" id="rail-unread" hidden></span>
  </button>
  <a class="toplink" href="ar.html">3D / AR</a>
</header>

<section class="fleet" id="fleet" aria-label="Worker fleet">
  <span class="fleet-label">Fleet</span>
  <div class="fleet-chips" id="fleet-chips"></div>
</section>

<main class="main">
  <section class="board" id="board" aria-label="Task board">
    <div class="project-bar" id="project-bar" hidden></div>
    <div class="planning" id="planning" hidden></div>
    <div class="columns" id="columns" hidden></div>
    <div class="empty" id="empty" hidden></div>
  </section>

  <aside class="rail" id="rail" aria-label="Agent chatter">
    <div class="rail-head">
      <h2>Agent chatter</h2>
      <span class="mono dim" id="rail-count"></span>
    </div>
    <ol class="msgs" id="rail-msgs"></ol>
    <form class="say" id="rail-form" autocomplete="off"></form>
  </aside>
</main>

<aside class="drawer" id="drawer" aria-labelledby="d-title" hidden></aside>

<dialog class="dialog" id="composer-dialog" aria-label="New product"></dialog>
<dialog class="dialog" id="addtask-dialog" aria-label="Add task"></dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="lib.js"></script>
<script src="demo.js"></script>
<script src="board.js"></script>
</body>
</html>
