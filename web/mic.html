<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>OnlyVibes: voice prompt (fallback mic)</title>
<style>
  html, body {
    margin: 0; min-height: 100%; background: #0b0e14; color: #e8ecf3;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: .5px; opacity: .85; }
  #controls { display: flex; gap: 8px; width: min(560px, 92vw); }
  #controls select { flex: 1; text-align: left; }
  #controls select {
    padding: 10px 14px; border-radius: 999px; border: 1px solid #22304a; cursor: pointer;
    background: #11151f; color: #e8ecf3; font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
  }
  #talk {
    width: min(260px, 70vw); height: min(260px, 70vw); border-radius: 50%; border: 0; cursor: pointer;
    background: #7dd3fc; color: #08222f; font: 600 20px/1.2 ui-sans-serif, system-ui, sans-serif;
    user-select: none; touch-action: none;
  }
  #talk.holding { background: #f87171; color: #2f0808; }
  #talk:disabled { opacity: .4; cursor: default; }
  .line { width: min(560px, 92vw); min-height: 1.4em; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .55; }
  #heard { color: #e8ecf3; }
  #result { color: #86efac; }
  #result.err { color: #fca5a5; }
  #cancel { display: none; padding: 8px 16px; border-radius: 999px; border: 1px solid #f87171; background: transparent; color: #fca5a5; cursor: pointer; }
  #status { font-size: 13px; opacity: .75; min-height: 1.2em; text-align: center; }
</style>
</head>
<body>
<h1>OnlyVibes: voice prompt (fallback mic)</h1>
<div id="controls"><select id="target"><option value="">pick an agent…</option></select></div>
<button id="talk">Hold to talk</button>
<button id="cancel" type="button">Cancel</button>
<div class="line"><div class="label">Heard</div><div id="heard"></div></div>
<div class="line"><div class="label">Result</div><div id="result"></div></div>
<div id="status">connecting…</div>

<script src="voice.js"></script>
<script>
"use strict";
// Fallback when the headset mic doesn't work: pick the target agent here, hold to talk, and the
// transcript interrupts that agent and becomes its new prompt (POST /api/control action=redirect),
// exactly like selecting a card in AR. Speech-to-text only (Voxtral); open with ?key=<control key>.
const KEY = new URLSearchParams(location.search).get('key') || '';
const HEADERS = { 'Content-Type': 'application/json', ...(KEY ? { 'X-OV-Key': KEY } : {}) };
const SEND_DELAY_MS = 2000;
const voice = window.OnlyVibesVoice;
const $ = (id) => document.getElementById(id);
const talk = $('talk'), cancelBtn = $('cancel'), heardEl = $('heard'), resultEl = $('result'), statusEl = $('status');
const targetSel = $('target');
const setStatus = (s) => { statusEl.textContent = s; };
const setResult = (s, err = false) => { resultEl.textContent = s; resultEl.className = err ? 'err' : ''; };
let pending = null;

function target() {
  if (!targetSel.value) return null;
  try { return JSON.parse(targetSel.value); } catch { return null; }
}
async function sendRedirect(t, text) {
  setResult(`sending to ${t.owner}'s ${t.agent}…`);
  try {
    const res = await fetch('/api/control', { method: 'POST', headers: HEADERS,
      body: JSON.stringify({ laptop: t.laptop, agent: t.agent, task_id: t.task_id || '', action: 'redirect', text }) });
    if (res.status === 403) return setResult('locked: open /mic?key=<control key>', true);
    const b = await res.json().catch(() => ({}));
    const msg = b.message || (b.error && b.error.message) || `HTTP ${res.status}`;
    setResult(b.ok ? `Sent to ${t.owner}'s ${t.agent}: ${msg}` : `Not sent: ${msg}`, !b.ok);
  } catch { setResult('could not reach the hub', true); }
}
cancelBtn.onclick = () => {
  if (!pending) return;
  clearTimeout(pending); pending = null; cancelBtn.style.display = 'none';
  setResult('cancelled: nothing sent', true);
};

if (!voice) setStatus('voice.js not loaded');
else voice.init({ role: 'mic',
  onUpdate: (u) => {
    heardEl.textContent = u.heard || '';
    if (u.status) setStatus(u.status);
    talk.classList.toggle('holding', u.state === 'listening');
    talk.textContent = u.state === 'listening' ? 'Release to send' : 'Hold to talk';
  },
  onTranscript: (text) => {
    const t = target();
    if (!t) return setResult('Select an agent first', true);
    setResult(`“${text}” → ${t.owner}'s ${t.agent} in 2 s…`);
    cancelBtn.style.display = '';
    pending = setTimeout(() => { pending = null; cancelBtn.style.display = 'none'; sendRedirect(t, text); }, SEND_DELAY_MS);
  },
  onBlocked: (why) => setStatus(why),
});

// first tap enables (mic permission), then hold-to-talk
let enabled = false, enabling = false, holding = false;
talk.addEventListener('pointerdown', async (e) => {
  e.preventDefault();
  try { talk.setPointerCapture(e.pointerId); } catch {}
  if (!voice) return;
  if (!target()) return setResult('Select an agent first', true);
  if (!enabled && !enabling) {
    enabling = true; talk.disabled = true;
    setStatus('enabling voice… (allow the microphone)');
    enabled = await voice.enable();
    talk.disabled = false; enabling = false;
    if (!enabled) { setStatus('no microphone'); return; }
  }
  holding = true;
  voice.begin();
});
const up = () => { if (holding) voice?.end(); holding = false; };
talk.addEventListener('pointerup', up);
talk.addEventListener('pointercancel', up);

// ---------------------------------------------------------------- WS /view: live agents for the dropdown
let gotReal = false, lastSig = '';
function fillTargets(laptops) {
  const opts = [];
  for (const l of laptops || []) for (const a of l.agents || []) {
    const t = { laptop: l.tailscale_ip || l.laptop, agent: a.name, task_id: a.task_id || '', owner: l.owner || l.laptop };
    opts.push([JSON.stringify(t), `${t.owner}: ${a.name}${a.task ? ' · ' + a.task : ''}`]);
  }
  const sig = JSON.stringify(opts);
  if (sig === lastSig) return;
  lastSig = sig;
  const keep = targetSel.value;
  targetSel.replaceChildren(new Option('pick an agent…', ''), ...opts.map(([v, label]) => new Option(label, v)));
  if (opts.some(([v]) => v === keep)) targetSel.value = keep;
}
function connect() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(proto + location.host + '/view');
  ws.onopen = () => { gotReal = true; setStatus('live'); };
  ws.onmessage = (ev) => {
    gotReal = true;
    try { fillTargets(JSON.parse(ev.data).laptops); } catch {}
  };
  ws.onclose = () => { if (!gotReal) setStatus('no server'); setTimeout(connect, 2000); };
  ws.onerror = () => { if (!gotReal) setStatus('no server'); };
}
connect();
</script>
</body>
</html>
