<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>OnlyVibes — 3D / AR table</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: #e8ecf3;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  /* link back to the orchestration board (DOM HUD only; not rendered inside the immersive AR layer) */
  #back {
    display: inline-block; margin-bottom: 8px; pointer-events: auto;
    font-size: 12px; color: #e8ecf3; text-decoration: none; opacity: .75;
    padding: 4px 8px; border: 1px solid rgba(232,236,243,.25); border-radius: 4px;
  }
  #back:hover, #back:focus-visible { opacity: 1; border-color: rgba(232,236,243,.6); }
  #hud { position: fixed; top: 12px; left: 14px; z-index: 10; pointer-events: none; }
  #hud h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .5px; }
  #hud p  { font-size: 12px; margin: 0; opacity: .7; }
  #status { position: fixed; top: 12px; right: 14px; z-index: 10; font-size: 12px; opacity: .85; text-align: right; }
  /* ARButton injects its own button; pin it to the bottom center */
  #app button, body > button {
    position: fixed !important; bottom: 24px !important; left: 50% !important;
    transform: translateX(-50%) !important; z-index: 20 !important;
    padding: 12px 22px !important; border-radius: 999px !important; border: 0 !important;
    background: #7dd3fc !important; color: #08222f !important;
    font: 600 15px/1 ui-sans-serif, system-ui, sans-serif !important; cursor: pointer !important;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <a id="back" href="./">&larr; Board</a>
  <h1>OnlyVibes</h1>
  <p>live AI agents on every laptop · <span id="count">0</span> laptops · AR needs HTTPS or localhost (try <code>tailscale serve</code>)</p>
</div>
<div id="status">connecting…</div>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local'); // origin = viewer at session start
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 9, 24);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.4, 5.4);
camera.lookAt(0, 0.7, 0);
// browser: drag = rotate, scroll/pinch = zoom, right-drag/two-finger = pan
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.7, 0);
orbit.enableDamping = true;
orbit.minDistance = 1.5;
orbit.maxDistance = 18;
orbit.maxPolarAngle = Math.PI * 0.49;
orbit.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(3, 6, 4);
scene.add(keyLight);
const rim = new THREE.PointLight(0x66aaff, 10, 25);
rim.position.set(-4, 3, -3);
scene.add(rim);

// ---------------------------------------------------------------- the table
const world = new THREE.Group();          // everything the AR session shows
scene.add(world);

const grid = new THREE.GridHelper(24, 24, 0x22304a, 0x131a29);
grid.position.y = 0.001;
world.add(grid);

const table = new THREE.Group();
const top = new THREE.Mesh(
  new THREE.CylinderGeometry(1.7, 1.7, 0.08, 48),
  new THREE.MeshStandardMaterial({ color: 0x2a3140, roughness: 0.55, metalness: 0.25 })
);
top.position.y = 0.75;
table.add(top);
const leg = new THREE.Mesh(
  new THREE.CylinderGeometry(0.08, 0.12, 0.75, 16),
  new THREE.MeshStandardMaterial({ color: 0x1a1f2b, roughness: 0.8 })
);
leg.position.y = 0.375;
table.add(leg);
world.add(table);

// ---------------------------------------------------------------- text cards
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// agent logos (web/logos/*.png), loaded once and cached; cards waiting on a logo
// are redrawn exactly once when it arrives
const LOGO_KEYS = ['claude-code', 'codex', 'vibe', 'cursor', 'agent'];
const logos = new Map(); // key -> { img, ready, waiting: Set<sprite> }
function agentLogoKey(name) {
  const n = String(name || '').toLowerCase();
  if (n.startsWith('claude')) return 'claude-code';
  if (n.startsWith('codex') || n.startsWith('openai')) return 'codex';
  if (n.startsWith('vibe') || n.startsWith('mistral')) return 'vibe';
  if (n.startsWith('cursor')) return 'cursor';
  return 'agent';
}
function getLogo(key) {
  if (!LOGO_KEYS.includes(key)) key = 'agent';
  let L = logos.get(key);
  if (!L) {
    L = { img: new Image(), ready: false, waiting: new Set() };
    L.img.onload = () => {
      L.ready = true;
      for (const sp of L.waiting) setCardText(sp, sp.userData.text, sp.userData.logo);
      L.waiting.clear();
    };
    L.img.onerror = () => { L.waiting.clear(); };
    L.img.src = `logos/${key}.png`;
    logos.set(key, L);
  }
  return L;
}
LOGO_KEYS.forEach(getLogo); // preload

function makeCard(opts = {}) {
  const { bg = 'rgba(15,20,30,0.88)', fg = '#dfe6f3', fontPx = 24, scaleMul = 1 } = opts;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: false }));
  sprite.userData = { canvas, ctx, bg, fg, fontPx, scaleMul, tex: null, text: null, logo: null, drawn: '' };
  setCardText(sprite, '');
  return sprite;
}

// logoKey (optional): draw that agent's logo in a square column left of the text
function setCardText(sprite, text, logoKey = null) {
  const { canvas, ctx, bg, fg, fontPx, scaleMul } = sprite.userData;
  const L = logoKey ? getLogo(logoKey) : null;
  // skip identical redraws (state frames arrive 2x/s) so textures never churn
  const sig = `${text}|${logoKey}|${L && L.ready}`;
  if (sprite.userData.drawn === sig && sprite.userData.tex) return;
  sprite.userData.text = text; sprite.userData.logo = logoKey; sprite.userData.drawn = sig;
  const maxW = 560, pad = 14, lineH = fontPx + 7;
  const logoPx = L ? lineH * 2 - 6 : 0, gap = L ? 14 : 0;
  const textW = maxW - logoPx - gap;
  ctx.font = `${fontPx}px ui-sans-serif, system-ui, sans-serif`;
  // wrap (honoring explicit newlines), keep at most 4 lines
  const lines = [];
  for (const para of String(text).split('\n')) {
    let cur = '';
    for (const w of para.split(/\s+/).filter(Boolean)) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > textW && cur) { lines.push(cur); cur = w; }
      else cur = t;
    }
    if (cur) lines.push(cur);
  }
  const shown = lines.slice(0, 4);
  if (lines.length > 4) shown[3] = shown[3].slice(0, -1) + '…';
  canvas.width = maxW + pad * 2;
  canvas.height = Math.max(Math.max(1, shown.length) * lineH, logoPx) + pad * 2;
  ctx.fillStyle = bg;
  roundRect(ctx, 0, 0, canvas.width, canvas.height, 14);
  ctx.fill();
  if (L) {
    if (L.ready) ctx.drawImage(L.img, pad, pad + 2, logoPx, logoPx);
    else L.waiting.add(sprite);
  }
  ctx.font = `${fontPx}px ui-sans-serif, system-ui, sans-serif`;
  ctx.fillStyle = fg;
  shown.forEach((ln, i) => ctx.fillText(ln, pad + logoPx + gap, pad + fontPx + i * lineH - 5));
  if (!sprite.userData.tex) {
    sprite.userData.tex = new THREE.CanvasTexture(canvas);
    sprite.material.map = sprite.userData.tex;
    sprite.material.needsUpdate = true;
  }
  sprite.userData.tex.needsUpdate = true;
  const s = 0.0032 * scaleMul; // world units per pixel
  sprite.scale.set(canvas.width * s, canvas.height * s, 1);
}

// ---------------------------------------------------------------- laptops
const LAPTOP_COLORS = [0x7dd3fc, 0xf0abfc, 0xa5b4fc, 0xfcd34d, 0xfca5a5, 0xc4b5fd];
const laptopGroups = new Map(); // key (tailscale_ip) -> THREE.Group

function buildLaptop(status, idx) {
  const g = new THREE.Group();
  const accent = new THREE.Color(LAPTOP_COLORS[idx % LAPTOP_COLORS.length]);

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(0.62, 0.035, 0.42),
    new THREE.MeshStandardMaterial({ color: 0x39415a, roughness: 0.5, metalness: 0.3 })
  );
  base.position.y = 0.018;
  g.add(base);

  const screen = new THREE.Mesh(
    new THREE.BoxGeometry(0.62, 0.4, 0.025),
    new THREE.MeshStandardMaterial({ color: 0x0d1117, emissive: accent, emissiveIntensity: 0.6, roughness: 0.3 })
  );
  screen.position.set(0, 0.21, -0.2);
  screen.rotation.x = -0.35;
  g.add(screen);

  const label = makeCard({ fontPx: 24, bg: 'rgba(15,20,30,0.9)' });
  label.position.y = 0.66;
  g.add(label);
  g.userData.label = label;
  g.userData.cards = new Map(); // agentKey -> sprite
  return g;
}

function layout() {
  const entries = [...laptopGroups.entries()].sort((a, b) => String(a[0]).localeCompare(String(b[0])));
  const n = Math.max(entries.length, 1);
  entries.forEach(([_key, g], i) => {
    const a = (i / n) * Math.PI * 2;
    g.position.set(Math.cos(a) * 2.5, 0.78, Math.sin(a) * 2.5); // sit on the table top
    g.lookAt(0, 0.78, 0);
  });
}

function applyState(snap) {
  const seen = new Set();
  (snap.laptops || []).forEach((st) => {
    const key = st.tailscale_ip || st.laptop;
    seen.add(key);
    let g = laptopGroups.get(key);
    if (!g) {
      g = buildLaptop(st, laptopGroups.size);
      laptopGroups.set(key, g);
      world.add(g);
      layout();
    }
    setCardText(g.userData.label, `${st.owner}`);

    const cards = g.userData.cards;
    const names = new Set();
    g.userData.lastSeen = performance.now();
    // sessions sorted by name; a subagent's name starts with its parent's, so it lands right under it
    const agents = [...(st.agents || [])].sort((x, y) => String(x.name).localeCompare(String(y.name)));
    let y = 1.05;
    agents.forEach((a) => {
      let ak = String(a.name || 'agent');
      for (let n = 2; names.has(ak); n++) ak = `${a.name} #${n}`; // never let two entries share a card
      names.add(ak);
      const sub = a.kind === 'subagent' || !!a.parent;
      let card = cards.get(ak);
      if (!card) {
        card = sub
          ? makeCard({ fontPx: 19, bg: 'rgba(14,22,40,0.9)', fg: '#c9d8f5', scaleMul: 0.8 })
          : makeCard({ fontPx: 21, bg: 'rgba(8,26,20,0.9)', fg: '#d9f4e6' });
        g.add(card);
        cards.set(ak, card);
      }
      const task = (a.task || a.summary || '').replace(/\s+/g, ' ').slice(0, 60);
      const label = sub ? '↳ ' + String(a.name).split(' › ').pop() : a.name;
      // subagents wear their parent's logo (smaller, via the card's scaleMul)
      const logoKey = agentLogoKey(sub && a.parent ? a.parent : a.name);
      setCardText(card, task ? `${label}\n${task}` : label, logoKey);
      const h = card.scale.y;
      card.userData.baseY = y + h / 2;
      card.position.set(sub ? 0.12 : 0, card.userData.baseY, 0);
      y += h + 0.04;
      Object.assign(card.userData, { isCard: true, agent: a, ak, laptopKey: key, group: g });
    });
    for (const [ak, card] of [...cards.entries()]) {
      if (!names.has(ak)) {
        if (selected && selected.card === card) closePanel(`${ak} ended`);
        g.remove(card); cards.delete(ak);
      }
    }
  });
  for (const [key, g] of [...laptopGroups.entries()]) {
    if (!seen.has(key) && performance.now() - (g.userData.lastSeen || 0) > 15000) { world.remove(g); laptopGroups.delete(key); layout(); }
  }
  document.getElementById('count').textContent = (snap.laptops || []).length;
}

// ---------------------------------------------------------------- live data (WS /view), no fake data
const statusEl = document.getElementById('status');
let gotReal = false;
let statusHoldUntil = 0; // keep control results visible for a few seconds

function connect() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(proto + location.host + '/view');
  ws.onopen = () => { statusEl.textContent = 'live'; };
  ws.onmessage = (ev) => {
    gotReal = true;
    if (performance.now() > statusHoldUntil) statusEl.textContent = 'live';
    try { applyState(JSON.parse(ev.data)); } catch { /* ignore bad frame */ }
  };
  ws.onclose = () => { if (!gotReal) statusEl.textContent = 'disconnected, retrying…'; setTimeout(connect, 2000); };
  ws.onerror = () => { if (!gotReal) statusEl.textContent = 'disconnected, retrying…'; };
}
connect();


// ---------------------------------------------------------------- WebXR "Enter AR"
const arButton = ARButton.createButton(renderer, { optionalFeatures: ['hit-test', 'local-floor'] });
arButton.textContent = '📱 Enter AR';
document.body.appendChild(arButton);
// in AR ('local' space: origin at the viewer, -z is forward): shrink the whole
// world to a tabletop miniature, 0.8m in front of the viewer at chest height
renderer.xr.addEventListener('sessionstart', () => {
  world.scale.setScalar(0.15);
  world.position.set(0, -0.3, -0.8);
  setTimeout(summonWorld, 300); // once the headset pose is known, put it right in front of you
});
renderer.xr.addEventListener('sessionend', () => {
  world.scale.setScalar(1);
  world.position.set(0, 0, 0);
});

// ---------------------------------------------------------------- controllers (ZapBox etc.)
// trigger (hold) = grab the whole scene and move it with your hand
// grip/squeeze   = summon the scene to 0.5m in front of your face
// thumbstick     = up/down scales, left/right rotates
const controllers = [];
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  const ray = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x7dd3fc }));
  ray.scale.z = 0.5;
  c.add(ray);
  c.userData.ray = ray;
  c.addEventListener('connected', (e) => { c.userData.source = e.data; });
  c.addEventListener('disconnected', () => { c.userData.source = null; });
  // trigger: on a card/button = select/press it; on empty space = grab the world (as before)
  c.addEventListener('selectstart', () => {
    if (pick(rayFromController(c))) return;
    if (!world.userData.grabbedBy) { c.attach(world); world.userData.grabbedBy = c; }
  });
  c.addEventListener('selectend', () => { if (world.userData.grabbedBy === c) { scene.attach(world); world.userData.grabbedBy = null; } });
  c.addEventListener('squeezestart', () => summonWorld());
  scene.add(c);
  controllers.push(c);
}
const _fwd = new THREE.Vector3(), _camPos = new THREE.Vector3();
function summonWorld() {
  if (world.userData.grabbedBy) { scene.attach(world); world.userData.grabbedBy = null; }
  const xrCam = renderer.xr.getCamera();
  xrCam.getWorldPosition(_camPos);
  xrCam.getWorldDirection(_fwd); _fwd.y = 0; _fwd.normalize();
  world.position.copy(_camPos).addScaledVector(_fwd, 0.5);
  world.position.y = _camPos.y - 0.35;
  world.rotation.set(0, Math.atan2(-_fwd.x, -_fwd.z), 0);
}
function pollSticks(dt) {
  for (const c of controllers) {
    const gp = c.userData.source && c.userData.source.gamepad;
    if (!gp || !gp.axes) continue;
    const x = gp.axes[2] ?? gp.axes[0] ?? 0, y = gp.axes[3] ?? gp.axes[1] ?? 0;
    if (Math.abs(y) > 0.5) world.scale.multiplyScalar(1 - y * dt * 1.2); // push up = bigger
    if (Math.abs(x) > 0.5) world.rotation.y -= x * dt * 1.5;
    const sc = THREE.MathUtils.clamp(world.scale.x, 0.03, 2);
    world.scale.setScalar(sc);
  }
}

// control secret: open this page as /ar?key=<OV_CONTROL_SECRET>; the key is sent
// with every control request (query param + X-OV-Key header)
const CONTROL_KEY = new URLSearchParams(location.search).get('key') || '';

// ---------------------------------------------------------------- select a card -> control panel
// Point a controller (trigger) or click with the mouse on an agent card: it lights up and a
// panel opens next to it. Buttons call POST /api/control; the hub (orchestra tasks) or that
// laptop's reporter (terminal sessions) decides what is allowed. No pids leave this page.
const raycaster = new THREE.Raycaster();
const _rayM = new THREE.Matrix4();
let selected = null;   // { card, ak, laptopKey }
let panelMode = 'main'; // 'main' | 'say'
const panel = new THREE.Group();
panel.visible = false;
const panelTitle = makeCard({ fontPx: 28, bg: 'rgba(20,24,36,0.96)', fg: '#ffffff', scaleMul: 0.62 });
const panelStatus = makeCard({ fontPx: 28, bg: 'rgba(20,24,36,0.85)', fg: '#ffe680', scaleMul: 0.62 });
panel.add(panelTitle, panelStatus);
let panelButtons = [];
const BTN_STYLE = {
  stop: 'rgba(170,32,44,0.97)', resume: 'rgba(22,120,70,0.97)', say: 'rgba(30,80,170,0.97)',
  close: 'rgba(70,76,92,0.97)', back: 'rgba(70,76,92,0.97)',
};
const QUICK_MESSAGES = ['continue', 'stop and summarize', 'wait for me'];

function cardType(a) {
  if (a.task_id) return 'task';
  if (a.kind === 'subagent' || a.parent) return 'subagent';
  if (a.kind === 'app') return 'app';
  return 'session';
}
function buttonsFor(a) {
  if (panelMode === 'say') return [...QUICK_MESSAGES.map((m) => ['say', `“${m}”`, m]), ['back', '← Back']];
  const t = cardType(a), claude = agentLogoKey(a.name) === 'claude-code';
  if (t === 'task') return [['stop', '■  Stop task'], ['resume', '▶  Resume / retry'], ['say', '✉  Message…'], ['close', '✕  Close']];
  if (t === 'subagent') return [['stop', '■  Stop (interrupts its session)'], ['close', '✕  Close']];
  if (t === 'app') return [['close', '✕  Close']];
  return [['stop', '■  Stop (Ctrl-C)'], ...(claude ? [['resume', '▶  Resume'], ['say', '✉  Message…']] : []), ['close', '✕  Close']];
}
function setStatus(text) {
  setCardText(panelStatus, text || ' ');
  panelStatus.visible = !!text;
  if (text) { statusEl.textContent = text; statusHoldUntil = performance.now() + 5000; }
}
function buildPanel() {
  if (!selected) return;
  const a = selected.card.userData.agent;
  for (const b of panelButtons) panel.remove(b);
  panelButtons = buttonsFor(a).map(([action, label, payload]) => {
    const b = makeCard({ fontPx: 40, bg: BTN_STYLE[action], fg: '#ffffff', scaleMul: 0.62 });
    setCardText(b, label);
    b.userData.button = { action, payload };
    panel.add(b);
    return b;
  });
  const t = cardType(a);
  const note = t === 'app' ? 'desktop app: view only from AR' : t === 'task' ? 'orchestra task' : t === 'subagent' ? 'subagent' : 'terminal session';
  setCardText(panelTitle, `${a.name}\n${note}`);
  // stack: title, buttons, status (panel-local, camera-aligned)
  let y = 0;
  for (const s of [panelTitle, ...panelButtons, panelStatus]) {
    s.position.set(0, y - s.scale.y / 2, 0);
    y -= s.scale.y + 0.03;
  }
}
function openPanel(card) {
  if (selected) selected.card.material.color.set(0xffffff);
  selected = { card, ak: card.userData.ak, laptopKey: card.userData.laptopKey };
  card.material.color.set(0xffe680); // highlight
  panelMode = 'main';
  card.userData.group.add(panel);
  panel.visible = true;
  setStatus('');
  buildPanel();
}
function closePanel(msg) {
  if (selected) selected.card.material.color.set(0xffffff);
  selected = null;
  panel.visible = false;
  if (panel.parent) panel.parent.remove(panel);
  if (msg) { statusEl.textContent = `${msg} · ${statusEl.textContent}`; statusHoldUntil = performance.now() + 5000; }
}
let busy = false;
async function control(action, text = '') {
  if (!selected || busy) return;
  const a = selected.card.userData.agent;
  busy = true;
  setStatus(`${action}…`);
  try {
    const url = CONTROL_KEY ? `api/control?key=${encodeURIComponent(CONTROL_KEY)}` : 'api/control';
    const headers = { 'Content-Type': 'application/json' };
    if (CONTROL_KEY) headers['X-OV-Key'] = CONTROL_KEY;
    const res = await fetch(url, {
      method: 'POST', headers,
      body: JSON.stringify({ laptop: selected.laptopKey, agent: a.name, task_id: a.task_id || '', action, text }),
    });
    if (res.status === 403) { setStatus('locked: add ?key=... to the URL'); return; }
    const body = await res.json().catch(() => ({}));
    setStatus(body.message || (body.error && body.error.message) || `HTTP ${res.status}`);
  } catch (e) {
    setStatus('could not reach the hub');
  } finally {
    busy = false;
  }
}
function press(btn) {
  const { action, payload } = btn.userData.button;
  if (action === 'close') return closePanel();
  if (action === 'back') { panelMode = 'main'; return buildPanel(); }
  if (action === 'say') {
    if (payload) { panelMode = 'main'; buildPanel(); return control('say', payload); }
    if (!renderer.xr.isPresenting) {
      const text = prompt(`Message for ${selected.card.userData.agent.name}:`, 'continue');
      return text && text.trim() ? control('say', text.trim()) : undefined;
    }
    panelMode = 'say'; return buildPanel(); // XR: quick messages
  }
  return control(action);
}
function interactiveHit(ray) {
  raycaster.ray.copy(ray);
  raycaster.camera = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  if (panel.visible) {
    const hb = raycaster.intersectObjects(panelButtons, false)[0];
    if (hb) return hb;
  }
  const cards = [];
  for (const g of laptopGroups.values()) cards.push(...g.userData.cards.values());
  return raycaster.intersectObjects(cards, false)[0] || null;
}
// returns true if the ray hit a card or button (so it must not grab the world)
function pick(ray) {
  const hit = interactiveHit(ray);
  if (!hit) return false;
  if (hit.object.userData.button) press(hit.object);
  else if (selected && selected.card === hit.object) closePanel();
  else openPanel(hit.object);
  return true;
}
function rayFromController(c) {
  _rayM.identity().extractRotation(c.matrixWorld);
  const r = new THREE.Ray();
  r.origin.setFromMatrixPosition(c.matrixWorld);
  r.direction.set(0, 0, -1).applyMatrix4(_rayM);
  return r;
}
// desktop: a click (not an orbit drag) on a card / button
const _down = new THREE.Vector2(), _ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => _down.set(e.clientX, e.clientY));
renderer.domElement.addEventListener('pointerup', (e) => {
  if (renderer.xr.isPresenting || e.button !== 0) return;
  if (Math.hypot(e.clientX - _down.x, e.clientY - _down.y) > 6) return;
  _ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  pick(raycaster.ray.clone());
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (renderer.xr.isPresenting) return;
  _ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  renderer.domElement.style.cursor = interactiveHit(raycaster.ray.clone()) ? 'pointer' : '';
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });
window.__ov = { openPanel, closePanel, press, control, laptopGroups, panelButtons: () => panelButtons, camera };

const _right = new THREE.Vector3();
function updatePanel(parentQ, camQ) {
  if (!selected || !panel.visible) return;
  const card = selected.card;
  panel.quaternion.copy(parentQ).multiply(camQ);
  _right.set(1, 0, 0).applyQuaternion(panel.quaternion);
  panel.position.copy(card.position).addScaledVector(_right, card.scale.x / 2 + panelTitle.scale.x / 2 + 0.08);
  panel.position.y += card.scale.y / 2;
}
function updateRays() {
  for (const c of controllers) {
    if (!c.userData.source || !c.userData.ray) continue;
    const hit = interactiveHit(rayFromController(c));
    c.userData.ray.material.color.set(hit ? 0xffe680 : 0x7dd3fc);
    c.userData.ray.scale.z = hit ? Math.max(0.05, hit.distance) : 0.5;
  }
}

// ---------------------------------------------------------------- loop / resize
const clock = new THREE.Clock();
const _camQ = new THREE.Quaternion(), _parentQ = new THREE.Quaternion();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  if (renderer.xr.isPresenting) { pollSticks(dt); updateRays(); } else orbit.update();
  // active camera: XR headset camera while presenting, desktop camera otherwise
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  cam.getWorldQuaternion(_camQ);
  for (const g of laptopGroups.values()) {
    g.updateWorldMatrix(true, false);
    g.getWorldQuaternion(_parentQ).invert();
    // billboard every text card (laptop label + agent cards) to face the camera
    if (g.userData.label) g.userData.label.quaternion.copy(_parentQ).multiply(_camQ);
    let j = 0;
    for (const card of g.userData.cards.values()) {
      card.quaternion.copy(_parentQ).multiply(_camQ);
      j++;
    }
    if (selected && selected.card.userData.group === g) updatePanel(_parentQ, _camQ);
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
