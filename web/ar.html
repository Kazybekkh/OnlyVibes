<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>OnlyVibes: AR agents</title>
<link rel="icon" type="image/svg+xml" href="logo/mark.svg" />
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: #e8ecf3;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  /* link back to the orchestration board (DOM HUD only; not rendered inside the immersive AR layer) */
  #back {
    display: inline-block; margin-bottom: 8px; pointer-events: auto;
    font-size: 12px; color: #e8ecf3; text-decoration: none; opacity: .75;
    padding: 4px 8px; border: 1px solid rgba(232,236,243,.25); border-radius: 4px;
  }
  #back:hover, #back:focus-visible { opacity: 1; border-color: rgba(232,236,243,.6); }
  .hudbtn {
    margin: 0 0 8px 6px; pointer-events: auto; cursor: pointer; font: 12px ui-sans-serif, system-ui, sans-serif;
    color: #e8ecf3; background: rgba(125,211,252,.12); padding: 4px 8px;
    border: 1px solid rgba(125,211,252,.45); border-radius: 4px;
  }
  .hudbtn:hover, .hudbtn:focus-visible { background: rgba(125,211,252,.25); }
  #hud { position: fixed; top: 12px; left: 14px; z-index: 10; pointer-events: none; }
  #hud h1 { margin: 0 0 6px; line-height: 0; }
  #hud h1 img { height: 20px; width: auto; }
  #hud p  { font-size: 12px; margin: 0; opacity: .7; }
  #status { position: fixed; top: 12px; right: 14px; z-index: 10; font-size: 12px; opacity: .85; text-align: right; }
  /* ARButton injects its own button; pin it to the bottom center */
  #app button, body > button {
    position: fixed !important; bottom: 24px !important; left: 50% !important;
    transform: translateX(-50%) !important; z-index: 20 !important;
    padding: 12px 22px !important; border-radius: 999px !important; border: 0 !important;
    background: #7dd3fc !important; color: #08222f !important;
    font: 600 15px/1 ui-sans-serif, system-ui, sans-serif !important; cursor: pointer !important;
  }
  /* Enter AR + Enter VR side by side (only one when ?mode=ar|vr) */
  body.both #ARButton { left: calc(50% - 95px) !important; }
  body.both #VRButton { left: calc(50% + 95px) !important; }
  #ARButton, #VRButton { width: auto !important; white-space: nowrap !important; }
  #VRButton[disabled], #VRButton.na { opacity: .5 !important; cursor: default !important; }
  /* voice (Ron's voice-integration): bottom-right, inside #voicebar so the ARButton rule above
     (#app button, body > button) does not restyle them; hidden until /api/voice/health says on */
  #voicebar { display: none; position: fixed; right: 14px; bottom: 24px; z-index: 30;
    flex-direction: column; gap: 8px; align-items: flex-end; }
  @media (max-width: 600px) { #voicebar { bottom: 80px; } }
  #voicebar button, #voicebar select { padding: 8px 14px; border-radius: 999px; border: 1px solid #4a5468;
    background: rgba(20,26,38,0.92); color: #e8ecf3; font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
    cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  #voicebar #voiceTalk { padding: 14px 22px; font-size: 15px; }
  #voicebar button.holding { background: #7dd3fc; color: #08222f; }
  #voicebar .hint { font-size: 11px; opacity: .6; }
  /* WebXR dom-overlay (phone AR): only shown while presenting */
  #xroverlay { display: none; }
  body.xr #xroverlay { display: block; }
  #xroverlay:xr-overlay { display: block; }  /* separate rule: unknown pseudo-classes drop the whole rule */
  #xroverlay #recenterBtn { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 40;
    padding: 12px 22px; border-radius: 999px; border: 0; background: rgba(125,211,252,.95); color: #08222f;
    font: 700 16px/1 ui-sans-serif, system-ui, sans-serif; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <a id="back" href="./">&larr; Board</a>
  <h1><img src="logo/onlyvibes-dark.svg" width="132" height="20" alt="OnlyVibes" /></h1>
  <p>live AI agents on every laptop · <span id="count">0</span> laptops · AR needs HTTPS or localhost (try <code>tailscale serve</code>)</p>
</div>
<div id="status">connecting…</div>
<div id="xroverlay"><button id="recenterBtn" type="button">⟲ Recenter</button></div>
<div id="voicebar">
  <button id="voiceEnable" type="button">🎙 Enable voice</button>
  <button id="voiceTalk" type="button" style="display:none">Hold to talk</button>
  <span class="hint">select an agent card, then hold B/Y in AR (Space on desktop) and speak its new prompt</span>
</div>
<script src="voice.js"></script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local'); // origin = viewer at session start
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101112);
scene.fog = new THREE.Fog(0x0b0e14, 9, 24);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.0, 3.2);
camera.lookAt(0, 1.0, -3.6);
// browser: drag = rotate, scroll/pinch = zoom, right-drag/two-finger = pan
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 1.0, -3.6);
orbit.enableDamping = true;
orbit.minDistance = 1.5;
orbit.maxDistance = 18;
orbit.maxPolarAngle = Math.PI * 0.49;
orbit.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(3, 6, 4);
scene.add(keyLight);
const rim = new THREE.PointLight(0x66aaff, 10, 25);
rim.position.set(-4, 3, -3);
scene.add(rim);

// ---------------------------------------------------------------- the scene
// world origin = the viewer; each laptop is a column (laptop model, owner/device label, agent cards
// stacked above) on an arc in front of you, grouped by owner. In AR the world is scaled down.
const world = new THREE.Group();          // everything the AR session shows
scene.add(world);

const grid = new THREE.GridHelper(24, 24, 0x22304a, 0x131a29);  // desktop floor only (hidden in AR)
grid.position.set(0, 0.001, -3);
world.add(grid);

// ---------------------------------------------------------------- text cards
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// agent logos (web/logos/*.png), loaded once and cached; cards waiting on a logo
// are redrawn exactly once when it arrives
const AGENT_BORDER = { 'claude-code': '#f49a83', codex: '#9ebda8', vibe: '#dfb96f', cursor: '#8a8d91', agent: '#5b5f64' };
const LOGO_KEYS = ['claude-code', 'codex', 'vibe', 'cursor', 'agent'];
const logos = new Map(); // key -> { img, ready, waiting: Set<sprite> }
function agentLogoKey(name) {
  const n = String(name || '').toLowerCase();
  if (n.startsWith('claude')) return 'claude-code';
  if (n.startsWith('codex') || n.startsWith('openai')) return 'codex';
  if (n.startsWith('vibe') || n.startsWith('mistral')) return 'vibe';
  if (n.startsWith('cursor')) return 'cursor';
  return 'agent';
}
function getLogo(key) {
  if (!LOGO_KEYS.includes(key)) key = 'agent';
  let L = logos.get(key);
  if (!L) {
    L = { img: new Image(), ready: false, waiting: new Set() };
    L.img.onload = () => {
      L.ready = true;
      for (const sp of L.waiting) setCardText(sp, sp.userData.text, sp.userData.logo);
      L.waiting.clear();
    };
    L.img.onerror = () => { L.waiting.clear(); };
    L.img.src = `logos/${key}.png`;
    logos.set(key, L);
  }
  return L;
}
LOGO_KEYS.forEach(getLogo); // preload

function makeCard(opts = {}) {
  const { bg = 'rgba(15,20,30,0.88)', fg = '#dfe6f3', fontPx = 24, scaleMul = 1 } = opts;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: false }));
  sprite.userData = { canvas, ctx, bg, fg, fontPx, scaleMul, tex: null, text: null, logo: null, drawn: '' };
  setCardText(sprite, '');
  return sprite;
}

// logoKey (optional): draw that agent's logo in a square column left of the text
const CARD_RES = 1.8;  // canvas pixels per design pixel: 560 -> ~1000px wide textures, crisp in the headset
function setCardText(sprite, text, logoKey = null) {
  const { canvas, ctx, bg, fg, scaleMul } = sprite.userData;
  const R = CARD_RES, fontPx = sprite.userData.fontPx * R;  // draw at ~1000px wide, same world size
  const L = logoKey ? getLogo(logoKey) : null;
  // skip identical redraws (state frames arrive 2x/s) so textures never churn
  const sig = `${text}|${logoKey}|${L && L.ready}|${sprite.userData.border || ''}`;
  if (sprite.userData.drawn === sig && sprite.userData.tex) return;
  sprite.userData.text = text; sprite.userData.logo = logoKey; sprite.userData.drawn = sig;
  const maxW = 560 * R, pad = 14 * R, lineH = fontPx + 7 * R;
  const logoPx = L ? lineH * 2 - 6 * R : 0, gap = L ? 14 * R : 0;
  const textW = maxW - logoPx - gap;
  ctx.font = `600 ${fontPx}px 'DM Sans', 'Space Grotesk', ui-sans-serif, system-ui, sans-serif`;
  // wrap (honoring explicit newlines), keep at most 4 lines
  const lines = [];
  for (const para of String(text).split('\n')) {
    let cur = '';
    for (const w of para.split(/\s+/).filter(Boolean)) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > textW && cur) { lines.push(cur); cur = w; }
      else cur = t;
    }
    if (cur) lines.push(cur);
  }
  const shown = lines.slice(0, 4);
  if (lines.length > 4) shown[3] = shown[3].slice(0, -1) + '…';
  canvas.width = maxW + pad * 2;
  canvas.height = Math.max(Math.max(1, shown.length) * lineH, logoPx) + pad * 2;
  ctx.fillStyle = bg;
  roundRect(ctx, 0, 0, canvas.width, canvas.height, 14 * R);
  ctx.fill();
  if (sprite.userData.border) { // agent-coloured outline (Claude coral, Codex green, Mistral amber)
    ctx.lineWidth = 4 * R; ctx.strokeStyle = sprite.userData.border;
    roundRect(ctx, 2 * R, 2 * R, canvas.width - 4 * R, canvas.height - 4 * R, 13 * R); ctx.stroke();
  }
  if (L) {
    if (L.ready) ctx.drawImage(L.img, pad, pad + 2 * R, logoPx, logoPx);
    else L.waiting.add(sprite);
  }
  ctx.font = `600 ${fontPx}px 'DM Sans', 'Space Grotesk', ui-sans-serif, system-ui, sans-serif`;
  ctx.fillStyle = fg;
  shown.forEach((ln, i) => ctx.fillText(ln, pad + logoPx + gap, pad + fontPx + i * lineH - 5 * R));
  if (!sprite.userData.tex) {
    sprite.userData.tex = new THREE.CanvasTexture(canvas);
    sprite.material.map = sprite.userData.tex;
    sprite.material.needsUpdate = true;
  }
  sprite.userData.tex.needsUpdate = true;
  if (sprite.userData.tex) sprite.userData.tex.anisotropy = 4;
  const s = 0.0032 * scaleMul / R; // world units per pixel (card ~1.9 units wide whatever the resolution)
  sprite.scale.set(canvas.width * s, canvas.height * s, 1);
}

// ---------------------------------------------------------------- laptops
const LAPTOP_COLORS = [0x7dd3fc, 0xf0abfc, 0xa5b4fc, 0xfcd34d, 0xfca5a5, 0xc4b5fd];
const laptopGroups = new Map(); // key (tailscale_ip) -> THREE.Group

// ---- procedural laptop models (light: a few boxes/planes + small canvas textures, cached)
// style by the reporter's device info: 'mac' (silver / space grey aluminium, thin bezel, notch,
// glowing lid mark), 'windows' (dark, squarer, thicker), 'thinkpad' (black, red dot; Lenovo/Linux)
import('three/addons/geometries/RoundedBoxGeometry.js').then((m) => { RoundedBox = m.RoundedBoxGeometry; refreshModels(); }).catch(() => {});
let RoundedBox = null;
const FONT = "'DM Sans', 'Space Grotesk', ui-sans-serif, system-ui, sans-serif";
const STYLES = {
  silver:    { deck: 0xa6abb2, lid: 0x9aa0a8, keys: '#2b2f34', keyBg: '#8f949b', pad: 0xb9bec5, deckH: 0.016, lidT: 0.007, bezel: 0.007, r: 0.008, notch: true, glow: true },
  spacegrey: { deck: 0x727880, lid: 0x6a7078, keys: '#1d2024', keyBg: '#5f656c', pad: 0x80868e, deckH: 0.016, lidT: 0.007, bezel: 0.007, r: 0.008, notch: true, glow: true },
  windows:   { deck: 0x353e48, lid: 0x2e363f, keys: '#14181d', keyBg: '#2c343d', pad: 0x46505b, deckH: 0.024, lidT: 0.012, bezel: 0.02, r: 0.003 },
  thinkpad:  { deck: 0x1d2126, lid: 0x1a1d21, keys: '#0b0c0e', keyBg: '#202429', pad: 0x2a2f35, deckH: 0.024, lidT: 0.012, bezel: 0.018, r: 0.003, redDot: true },
};
function deviceStyle(dev = {}) {
  const fam = (dev.os_family || '').toLowerCase(), vendor = (dev.vendor || '').toLowerCase(), model = (dev.model || '').toLowerCase();
  if (fam === 'macos' || vendor.startsWith('apple')) return model.includes('pro') ? 'spacegrey' : 'silver';
  if (vendor.includes('lenovo') || model.includes('thinkpad') || fam === 'linux') return 'thinkpad';
  return 'windows';
}
const _texCache = new Map();
function canvasTex(key, w, h, draw) {
  if (_texCache.has(key)) return _texCache.get(key);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  _texCache.set(key, t);
  return t;
}
function screenTex(accentHex) { // dark screen, subtle top bar, code lines in the laptop's colour
  return canvasTex(`screen:${accentHex}`, 256, 160, (ctx, w, h) => {
    const gr = ctx.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#20282e'); gr.addColorStop(1, '#0e1318');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#1a2127'; ctx.fillRect(0, 0, w, 14);
    ['#f49a83', '#dfb96f', '#9ebda8'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(10 + i * 10, 7, 3, 0, 7); ctx.fill(); });
    const col = '#' + accentHex.toString(16).padStart(6, '0');
    let seed = accentHex % 97;
    for (let y = 26; y < h - 8; y += 11) {
      seed = (seed * 37 + 11) % 101;
      const indent = 10 + (seed % 4) * 12, len = 40 + (seed * 7) % 150;
      ctx.globalAlpha = 0.55 + (seed % 3) * 0.15; ctx.fillStyle = seed % 5 ? col : '#8a8d91';
      ctx.fillRect(indent, y, len, 4);
    }
    ctx.globalAlpha = 1;
  });
}
function keysTex(style) {
  const st = STYLES[style];
  return canvasTex(`keys:${style}`, 256, 96, (ctx, w, h) => {
    ctx.fillStyle = st.keyBg; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = st.keys;
    const rows = 5, cols = 14, kw = (w - 8) / cols, kh = (h - 6) / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (r === rows - 1 && c > 3 && c < 9) continue; // space bar drawn below
      ctx.fillRect(4 + c * kw + 1, 3 + r * kh + 1, kw - 2.5, kh - 2.5);
    }
    ctx.fillRect(4 + 4 * kw + 1, 3 + (rows - 1) * kh + 1, 5 * kw - 2.5, kh - 2.5);
  });
}
function lidMarkTex(glow) { // small 'ov✳' mark on the lid back (no vendor logos)
  return canvasTex(`mark:${glow}`, 128, 64, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.font = `600 40px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (glow) { ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12; }
    ctx.fillStyle = glow ? 'rgba(255,255,255,0.92)' : 'rgba(170,176,184,0.75)';
    ctx.fillText('ov✳', w / 2, h / 2 + 2);
  });
}
const _matCache = new Map();
function mat(key, make) { if (!_matCache.has(key)) _matCache.set(key, make()); return _matCache.get(key); }
function box(w, h, d, r) { return RoundedBox && r > 0.001 ? new RoundedBox(w, h, d, 2, r) : new THREE.BoxGeometry(w, h, d); }

function buildLaptopModel(style, accentHex) {
  const st = STYLES[style] || STYLES.windows;
  const m = new THREE.Group();
  const W = 0.62, D = 0.43;
  const metal = mat(`deck:${style}`, () => new THREE.MeshStandardMaterial({ color: st.deck, roughness: style === 'thinkpad' ? 0.85 : 0.5, metalness: style.startsWith('s') ? 0.25 : 0.15 }));
  const lidMat = mat(`lid:${style}`, () => new THREE.MeshStandardMaterial({ color: st.lid, roughness: style === 'thinkpad' ? 0.85 : 0.5, metalness: style.startsWith('s') ? 0.25 : 0.15 }));
  const deck = new THREE.Mesh(box(W, st.deckH, D, st.r), metal);
  deck.position.y = st.deckH / 2;
  m.add(deck);
  const top = st.deckH + 0.0008;
  const keys = new THREE.Mesh(new THREE.PlaneGeometry(0.54, 0.2), mat(`keys:${style}`, () => new THREE.MeshBasicMaterial({ map: keysTex(style) })));
  keys.rotation.x = -Math.PI / 2; keys.position.set(0, top, -0.07);
  m.add(keys);
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.12), mat(`pad:${style}`, () => new THREE.MeshStandardMaterial({ color: st.pad, roughness: 0.3, metalness: 0.2 })));
  pad.rotation.x = -Math.PI / 2; pad.position.set(0, top, 0.125);
  m.add(pad);
  if (st.redDot) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.007, 10, 6), mat('red', () => new THREE.MeshBasicMaterial({ color: 0xe0242b })));
    dot.position.set(0, top + 0.002, -0.045);
    m.add(dot);
    const btns = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.018), mat('tpbtn', () => new THREE.MeshBasicMaterial({ color: 0x0d0f11 })));
    btns.rotation.x = -Math.PI / 2; btns.position.set(0, top + 0.0004, 0.055);
    m.add(btns);
  }
  // lid: hinge at the back edge, opened ~104 deg (screen tilted back ~14 deg past vertical)
  const hinge = new THREE.Group();
  hinge.position.set(0, st.deckH, -D / 2 + 0.004);
  hinge.rotation.x = -0.25;
  m.add(hinge);
  const LH = 0.4;
  const lid = new THREE.Mesh(box(W, LH, st.lidT, st.r), lidMat);
  lid.position.set(0, LH / 2, -st.lidT / 2);
  hinge.add(lid);
  const bezel = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.01, LH - 0.01), mat('bezel', () => new THREE.MeshBasicMaterial({ color: 0x0b0d0f })));
  bezel.position.set(0, LH / 2, 0.0006);
  hinge.add(bezel);
  const display = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.01 - 2 * st.bezel, LH - 0.01 - 2 * st.bezel - (st.notch ? 0 : 0.01)),
    mat(`screen:${accentHex}`, () => new THREE.MeshBasicMaterial({ map: screenTex(accentHex) })));
  display.position.set(0, LH / 2 - (st.notch ? 0 : 0.005), 0.0012);
  hinge.add(display);
  if (st.notch) {
    const notch = new THREE.Mesh(new THREE.PlaneGeometry(0.07, 0.014), mat('bezel', () => new THREE.MeshBasicMaterial({ color: 0x0b0d0f })));
    notch.position.set(0, LH - 0.005 - st.bezel - 0.006, 0.0018);
    hinge.add(notch);
  }
  const mark = new THREE.Mesh(new THREE.PlaneGeometry(0.09, 0.045), mat(`mark:${!!st.glow}`, () => new THREE.MeshBasicMaterial({ map: lidMarkTex(!!st.glow), transparent: true })));
  mark.position.set(0, LH * 0.55, -st.lidT - 0.0008); mark.rotation.y = Math.PI;
  hinge.add(mark);
  if (st.redDot) {
    const d2 = new THREE.Mesh(new THREE.CircleGeometry(0.005, 10), mat('red', () => new THREE.MeshBasicMaterial({ color: 0xe0242b })));
    d2.position.set(-W / 2 + 0.06, LH * 0.12, -st.lidT - 0.0008); d2.rotation.y = Math.PI;
    hinge.add(d2);
  }
  m.userData.isModel = true;
  return m;
}
function setLaptopModel(g, dev) {
  const style = deviceStyle(dev);
  const sig = `${style}|${!!RoundedBox}`;
  if (g.userData.modelSig === sig) return;
  if (g.userData.model) g.remove(g.userData.model);
  g.userData.model = buildLaptopModel(style, g.userData.accentHex);
  g.userData.modelSig = sig;
  g.add(g.userData.model);
}
function refreshModels() { for (const g of laptopGroups.values()) setLaptopModel(g, g.userData.device || {}); }

// ---- owner tag under each laptop: initials avatar, "<Owner>'s MacBook Pro", model · chip · OS, green dot
function deviceLine(dev = {}) {
  const chip = (dev.chip || '').replace(/^Apple /, '');
  return [dev.model, chip, dev.os].filter(Boolean).join(' · ');
}
function machineName(dev = {}) {
  if (dev.model) return dev.model;
  const fam = (dev.os_family || '').toLowerCase();
  return fam === 'macos' ? 'Mac' : fam === 'windows' ? 'PC' : fam === 'linux' ? 'Linux laptop' : 'laptop';
}
function makeOwnerTag() {
  const canvas = document.createElement('canvas'); canvas.width = 640; canvas.height = 128;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: false }));
  sp.userData = { canvas, ctx: canvas.getContext('2d'), sig: '' };
  sp.userData.tex = new THREE.CanvasTexture(canvas); sp.userData.tex.colorSpace = THREE.SRGBColorSpace;
  sp.material.map = sp.userData.tex;
  sp.scale.set(640 * 0.0026, 128 * 0.0026, 1);
  sp.renderOrder = 2;
  return sp;
}

  cam.getWorldPosition(_vP); cam.getWorldQuaternion(_vQ);
  // above the cards (their tops sit ~12 deg above eye line at 1.2 m), so it never covers them
  _vF.set(0, renderer.xr.isPresenting ? 0.45 : 0.22, -1).normalize().applyQuaternion(_vQ);
  voiceCard.position.copy(_vP).addScaledVector(_vF, renderer.xr.isPresenting ? 0.9 : 2.2);
}

// ---------------------------------------------------------------- select a card -> control panel
// Point a controller (trigger) or click with the mouse on an agent card: it lights up and a
// panel opens next to it. Buttons call POST /api/control; the hub (orchestra tasks) or that
// laptop's reporter (terminal sessions) decides what is allowed. No pids leave this page.
const raycaster = new THREE.Raycaster();
const _rayM = new THREE.Matrix4();
let selected = null;   // { card, ak, laptopKey }
let panelMode = 'main'; // 'main' | 'say'
const panel = new THREE.Group();
panel.visible = false;
const panelTitle = makeCard({ fontPx: 28, bg: 'rgba(20,24,36,0.96)', fg: '#ffffff', scaleMul: 0.62 });
const panelStatus = makeCard({ fontPx: 28, bg: 'rgba(20,24,36,0.85)', fg: '#ffe680', scaleMul: 0.62 });
panel.add(panelTitle, panelStatus);
let panelButtons = [];
const BTN_STYLE = {
  stop: 'rgba(170,32,44,0.97)', resume: 'rgba(22,120,70,0.97)', say: 'rgba(30,80,170,0.97)',
  close: 'rgba(70,76,92,0.97)', back: 'rgba(70,76,92,0.97)', focus: 'rgba(180,120,40,0.97)',
};
const QUICK_MESSAGES = ['continue', 'stop and summarize', 'wait for me'];

function cardType(a) {
  if (a.task_id) return 'task';
  if (a.kind === 'subagent' || a.parent) return 'subagent';
  if (a.kind === 'app') return 'app';
  return 'session';
}
function buttonsFor(a) {
  if (panelMode === 'say') return [...QUICK_MESSAGES.map((m) => ['say', `“${m}”`, m]), ['back', '← Back']];
  const t = cardType(a), claude = agentLogoKey(a.name) === 'claude-code';
  if (t === 'task') return [['stop', '■  Stop task'], ['resume', '▶  Resume / retry'], ['say', '✉  Message…'], ['close', '✕  Close']];
  // focus = bring that agent's app / terminal window to the front on the owner's laptop
  const focus = ['focus', '⧉  Focus on laptop'];
  if (t === 'subagent') return [focus, ['stop', '■  Stop (interrupts its session)'], ['close', '✕  Close']];
  if (t === 'app') return [focus, ['close', '✕  Close']];
  return [focus, ['stop', '■  Stop (Ctrl-C)'], ...(claude ? [['resume', '▶  Resume'], ['say', '✉  Message…']] : []), ['close', '✕  Close']];
}
function setStatus(text) {
  setCardText(panelStatus, text || ' ');
  panelStatus.visible = !!text;
  if (text) { statusEl.textContent = text; statusHoldUntil = performance.now() + 5000; }
}
function buildPanel() {
  if (!selected) return;
  const a = selected.card.userData.agent;
  for (const b of panelButtons) panel.remove(b);
  panelButtons = buttonsFor(a).map(([action, label, payload]) => {
    const b = makeCard({ fontPx: 40, bg: BTN_STYLE[action], fg: '#ffffff', scaleMul: 0.62 });
    setCardText(b, label);
    b.userData.button = { action, payload };
    panel.add(b);
    return b;
  });
  const t = cardType(a);
  const note = t === 'app' ? 'desktop app: focus only' : t === 'task' ? 'orchestra task' : t === 'subagent' ? 'subagent' : 'terminal session';
  setCardText(panelTitle, `${a.name}\n${note}`);
  // stack: title, buttons, status (panel-local, camera-aligned)
  let y = 0;
  for (const s of [panelTitle, ...panelButtons, panelStatus]) {
    s.position.set(0, y - s.scale.y / 2, 0);
    y -= s.scale.y + 0.03;
  }
}
function openPanel(card) {
  if (selected) selected.card.material.color.set(0xffffff);
  selected = { card, ak: card.userData.ak, laptopKey: card.userData.laptopKey };
  card.material.color.set(0xffe680); // highlight
  window.__showVoiceTarget?.();      // the selected card is also the voice target
  panelMode = 'main';
  card.userData.group.add(panel);
  panel.visible = true;
  setStatus('');
  buildPanel();
}
function closePanel(msg) {
  if (selected) selected.card.material.color.set(0xffffff);
  selected = null;
  panel.visible = false;
  if (panel.parent) panel.parent.remove(panel);
  if (msg) { statusEl.textContent = `${msg} · ${statusEl.textContent}`; statusHoldUntil = performance.now() + 5000; }
}
let busy = false;
async function control(action, text = '') {
  if (!selected || busy) return;
  const a = selected.card.userData.agent;
  busy = true;
  setStatus(`${action}…`);
  try {
    const url = CONTROL_KEY ? `api/control?key=${encodeURIComponent(CONTROL_KEY)}` : 'api/control';
    const headers = { 'Content-Type': 'application/json' };
    if (CONTROL_KEY) headers['X-OV-Key'] = CONTROL_KEY;
    const res = await fetch(url, {
      method: 'POST', headers,
      body: JSON.stringify({ laptop: selected.laptopKey, agent: a.name, task_id: a.task_id || '', action, text }),
    });
    if (res.status === 403) { setStatus('locked: add ?key=... to the URL'); return; }
    const body = await res.json().catch(() => ({}));
    if (action === 'focus' && body.ok) {
      const owner = (selected && selected.card.userData.group && selected.card.userData.group.userData.owner) || 'the owner';
      setStatus(`Opened on ${owner}'s laptop`);
      return;
    }
    setStatus(body.message || (body.error && body.error.message) || `HTTP ${res.status}`);
  } catch (e) {
    setStatus('could not reach the hub');
  } finally {
    busy = false;
  }
}
function press(btn) {
  const { action, payload } = btn.userData.button;
  if (action === 'close') return closePanel();
  if (action === 'back') { panelMode = 'main'; return buildPanel(); }
  if (action === 'say') {
    if (payload) { panelMode = 'main'; buildPanel(); return control('say', payload); }
    if (!renderer.xr.isPresenting) {
      const text = prompt(`Message for ${selected.card.userData.agent.name}:`, 'continue');
      return text && text.trim() ? control('say', text.trim()) : undefined;
    }
    panelMode = 'say'; return buildPanel(); // XR: quick messages
  }
  return control(action);
}
function interactiveHit(ray) {
  raycaster.ray.copy(ray);
  raycaster.camera = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  if (panel.visible) {
    const hb = raycaster.intersectObjects(panelButtons, false)[0];
    if (hb) return hb;
  }
  const cards = [];
  for (const g of laptopGroups.values()) cards.push(...g.userData.cards.values());
  return raycaster.intersectObjects(cards, false)[0] || null;
}
// returns true if the ray hit a card or button (so it must not grab the world)
function pick(ray) {
  const hit = interactiveHit(ray);
  if (!hit) return false;
  if (hit.object.userData.button) press(hit.object);
  else if (selected && selected.card === hit.object) closePanel();
  else openPanel(hit.object);
  return true;
}
function rayFromController(c) {
  _rayM.identity().extractRotation(c.matrixWorld);
  const r = new THREE.Ray();
  r.origin.setFromMatrixPosition(c.matrixWorld);
  r.direction.set(0, 0, -1).applyMatrix4(_rayM);
  return r;
}
// desktop: a click (not an orbit drag) on a card / button
const _down = new THREE.Vector2(), _ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => _down.set(e.clientX, e.clientY));
renderer.domElement.addEventListener('pointerup', (e) => {
  if (renderer.xr.isPresenting || e.button !== 0) return;
  if (Math.hypot(e.clientX - _down.x, e.clientY - _down.y) > 6) return;
  _ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  pick(raycaster.ray.clone());
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (renderer.xr.isPresenting) return;
  _ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  renderer.domElement.style.cursor = interactiveHit(raycaster.ray.clone()) ? 'pointer' : '';
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });
window.__ov = { openPanel, closePanel, press, control, laptopGroups, panelButtons: () => panelButtons, camera, orbit };

const _right = new THREE.Vector3();
function updatePanel(parentQ, camQ) {
  if (!selected || !panel.visible) return;
  const card = selected.card;
  panel.quaternion.copy(parentQ).multiply(camQ);
  _right.set(1, 0, 0).applyQuaternion(panel.quaternion);
  panel.position.copy(card.position).addScaledVector(_right, card.scale.x / 2 + panelTitle.scale.x / 2 + 0.08);
  panel.position.y += card.scale.y / 2;
}
function updateRays() {
  for (const c of controllers) {
    if (!c.userData.source || !c.userData.ray) continue;
    const hit = interactiveHit(rayFromController(c));
    c.userData.ray.material.color.set(hit ? 0xffe680 : 0x7dd3fc);
    c.userData.ray.scale.z = hit ? Math.max(0.05, hit.distance) : 0.5;
  }
}

// ---------------------------------------------------------------- loop / resize
const clock = new THREE.Clock();
const _camQ = new THREE.Quaternion(), _parentQ = new THREE.Quaternion();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  if (renderer.xr.isPresenting) {
    xrFrame++;
    if (recenterFrames.length && xrFrame >= recenterFrames[0]) { recenterFrames.shift(); recenter(); }
    pollSticks(dt); updateRays(); pollVoiceButtons();
    if (!recenterFrames.length) watchOutOfView(renderer.xr.getCamera(), performance.now());
  } else orbit.update();
  // active camera: XR headset camera while presenting, desktop camera otherwise
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  cam.getWorldQuaternion(_camQ);
  updateVoiceCard(cam);
  for (const g of laptopGroups.values()) {
    g.updateWorldMatrix(true, false);
    g.getWorldQuaternion(_parentQ).invert();
    // billboard every text card (laptop label + agent cards) to face the camera
    if (g.userData.label) g.userData.label.quaternion.copy(_parentQ).multiply(_camQ);
    let j = 0;
    for (const card of g.userData.cards.values()) {
      card.quaternion.copy(_parentQ).multiply(_camQ);
      j++;
    }
    if (selected && selected.card.userData.group === g) updatePanel(_parentQ, _camQ);
  }
  renderer.render(scene, camera);
});

if (XR_PREVIEW) {
  world.scale.setScalar(AR_SCALE); grid.visible = false; orbit.enabled = false;
  camera.fov = 90; camera.position.set(0, 0, 0); camera.lookAt(0, 0, -1); camera.updateProjectionMatrix();
  orbit.update = () => {};
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
