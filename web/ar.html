<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>OnlyVibes — 3D / AR table</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: #e8ecf3;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  /* link back to the orchestration board (DOM HUD only; not rendered inside the immersive AR layer) */
  #back {
    display: inline-block; margin-bottom: 8px; pointer-events: auto;
    font-size: 12px; color: #e8ecf3; text-decoration: none; opacity: .75;
    padding: 4px 8px; border: 1px solid rgba(232,236,243,.25); border-radius: 4px;
  }
  #back:hover, #back:focus-visible { opacity: 1; border-color: rgba(232,236,243,.6); }
  #hud { position: fixed; top: 12px; left: 14px; z-index: 10; pointer-events: none; }
  #hud h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .5px; }
  #hud p  { font-size: 12px; margin: 0; opacity: .7; }
  #status { position: fixed; top: 12px; right: 14px; z-index: 10; font-size: 12px; opacity: .85; text-align: right; }
  /* ARButton injects its own button; pin it to the bottom center */
  #app button, body > button {
    position: fixed !important; bottom: 24px !important; left: 50% !important;
    transform: translateX(-50%) !important; z-index: 20 !important;
    padding: 12px 22px !important; border-radius: 999px !important; border: 0 !important;
    background: #7dd3fc !important; color: #08222f !important;
    font: 600 15px/1 ui-sans-serif, system-ui, sans-serif !important; cursor: pointer !important;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <a id="back" href="./">&larr; Board</a>
  <h1>OnlyVibes</h1>
  <p>live AI agents on every laptop · <span id="count">0</span> laptops · AR needs HTTPS or localhost (try <code>tailscale serve</code>)</p>
</div>
<div id="status">connecting…</div>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local'); // origin = viewer at session start
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 9, 24);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.4, 5.4);
camera.lookAt(0, 0.7, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(3, 6, 4);
scene.add(keyLight);
const rim = new THREE.PointLight(0x66aaff, 10, 25);
rim.position.set(-4, 3, -3);
scene.add(rim);

// ---------------------------------------------------------------- the table
const world = new THREE.Group();          // everything the AR session shows
scene.add(world);

const grid = new THREE.GridHelper(24, 24, 0x22304a, 0x131a29);
grid.position.y = 0.001;
world.add(grid);

const table = new THREE.Group();
const top = new THREE.Mesh(
  new THREE.CylinderGeometry(1.7, 1.7, 0.08, 48),
  new THREE.MeshStandardMaterial({ color: 0x2a3140, roughness: 0.55, metalness: 0.25 })
);
top.position.y = 0.75;
table.add(top);
const leg = new THREE.Mesh(
  new THREE.CylinderGeometry(0.08, 0.12, 0.75, 16),
  new THREE.MeshStandardMaterial({ color: 0x1a1f2b, roughness: 0.8 })
);
leg.position.y = 0.375;
table.add(leg);
world.add(table);

// ---------------------------------------------------------------- text cards
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function makeCard(opts = {}) {
  const { bg = 'rgba(15,20,30,0.88)', fg = '#dfe6f3', fontPx = 24 } = opts;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: false }));
  sprite.userData = { canvas, ctx, bg, fg, fontPx, tex: null };
  setCardText(sprite, '');
  return sprite;
}

function setCardText(sprite, text) {
  const { canvas, ctx, bg, fg, fontPx } = sprite.userData;
  const maxW = 560, pad = 14, lineH = fontPx + 7;
  ctx.font = `${fontPx}px ui-sans-serif, system-ui, sans-serif`;
  // wrap (honoring explicit newlines), keep at most 4 lines
  const lines = [];
  for (const para of String(text).split('\n')) {
    let cur = '';
    for (const w of para.split(/\s+/).filter(Boolean)) {
      const t = cur ? cur + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = t;
    }
    if (cur) lines.push(cur);
  }
  const shown = lines.slice(0, 4);
  if (lines.length > 4) shown[3] = shown[3].slice(0, -1) + '…';
  canvas.width = maxW + pad * 2;
  canvas.height = Math.max(1, shown.length) * lineH + pad * 2;
  ctx.fillStyle = bg;
  roundRect(ctx, 0, 0, canvas.width, canvas.height, 14);
  ctx.fill();
  ctx.font = `${fontPx}px ui-sans-serif, system-ui, sans-serif`;
  ctx.fillStyle = fg;
  shown.forEach((ln, i) => ctx.fillText(ln, pad, pad + fontPx + i * lineH - 5));
  if (!sprite.userData.tex) {
    sprite.userData.tex = new THREE.CanvasTexture(canvas);
    sprite.material.map = sprite.userData.tex;
    sprite.material.needsUpdate = true;
  }
  sprite.userData.tex.needsUpdate = true;
  const s = 0.0032; // world units per pixel
  sprite.scale.set(canvas.width * s, canvas.height * s, 1);
}

// ---------------------------------------------------------------- laptops
const LAPTOP_COLORS = [0x7dd3fc, 0xf0abfc, 0x86efac, 0xfcd34d, 0xfca5a5, 0xc4b5fd];
const laptopGroups = new Map(); // key (tailscale_ip) -> THREE.Group

function buildLaptop(status, idx) {
  const g = new THREE.Group();
  const accent = new THREE.Color(LAPTOP_COLORS[idx % LAPTOP_COLORS.length]);

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(0.62, 0.035, 0.42),
    new THREE.MeshStandardMaterial({ color: 0x39415a, roughness: 0.5, metalness: 0.3 })
  );
  base.position.y = 0.018;
  g.add(base);

  const screen = new THREE.Mesh(
    new THREE.BoxGeometry(0.62, 0.4, 0.025),
    new THREE.MeshStandardMaterial({ color: 0x0d1117, emissive: accent, emissiveIntensity: 0.6, roughness: 0.3 })
  );
  screen.position.set(0, 0.21, -0.2);
  screen.rotation.x = -0.35;
  g.add(screen);

  const label = makeCard({ fontPx: 24, bg: 'rgba(15,20,30,0.9)' });
  label.position.y = 0.66;
  g.add(label);
  g.userData.label = label;
  g.userData.cards = new Map(); // agentKey -> sprite
  return g;
}

function layout() {
  const entries = [...laptopGroups.entries()].sort((a, b) => String(a[0]).localeCompare(String(b[0])));
  const n = Math.max(entries.length, 1);
  entries.forEach(([_key, g], i) => {
    const a = (i / n) * Math.PI * 2;
    g.position.set(Math.cos(a) * 2.5, 0.78, Math.sin(a) * 2.5); // sit on the table top
    g.lookAt(0, 0.78, 0);
  });
}

function applyState(snap) {
  const seen = new Set();
  (snap.laptops || []).forEach((st) => {
    const key = st.tailscale_ip || st.laptop;
    seen.add(key);
    let g = laptopGroups.get(key);
    if (!g) {
      g = buildLaptop(st, laptopGroups.size);
      laptopGroups.set(key, g);
      world.add(g);
      layout();
    }
    setCardText(g.userData.label, `${st.owner}`);

    const cards = g.userData.cards;
    const names = new Set();
    g.userData.lastSeen = performance.now();
    const agents = [...(st.agents || [])].sort((x, y) => x.name.localeCompare(y.name));
    agents.forEach((a, j) => {
      const ak = a.name;
      names.add(ak);
      let card = cards.get(ak);
      if (!card) {
        card = makeCard({ fontPx: 21, bg: 'rgba(8,26,20,0.9)', fg: '#d9f4e6' });
        g.add(card);
        cards.set(ak, card);
      }
      card.userData.baseY = 1.05 + j * 0.36;
      card.position.set(0, card.userData.baseY, 0);
      const task = (a.task || a.summary || '').replace(/\s+/g, ' ').slice(0, 60);
      setCardText(card, task ? `${a.name}\n${task}` : a.name);
    });
    for (const [ak, card] of [...cards.entries()]) {
      if (!names.has(ak)) { g.remove(card); cards.delete(ak); }
    }
  });
  for (const [key, g] of [...laptopGroups.entries()]) {
    if (!seen.has(key) && performance.now() - (g.userData.lastSeen || 0) > 15000) { world.remove(g); laptopGroups.delete(key); layout(); }
  }
  document.getElementById('count').textContent = (snap.laptops || []).length;
}

// ---------------------------------------------------------------- live data (WS /view), no fake data
const statusEl = document.getElementById('status');
let gotReal = false;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(proto + location.host + '/view');
  ws.onopen = () => { statusEl.textContent = 'live'; };
  ws.onmessage = (ev) => {
    gotReal = true;
    statusEl.textContent = 'live';
    try { applyState(JSON.parse(ev.data)); } catch { /* ignore bad frame */ }
  };
  ws.onclose = () => { if (!gotReal) statusEl.textContent = 'disconnected, retrying…'; setTimeout(connect, 2000); };
  ws.onerror = () => { if (!gotReal) statusEl.textContent = 'disconnected, retrying…'; };
}
connect();


// ---------------------------------------------------------------- WebXR "Enter AR"
const arButton = ARButton.createButton(renderer, { optionalFeatures: ['hit-test', 'local-floor'] });
arButton.textContent = '📱 Enter AR';
document.body.appendChild(arButton);
// in AR ('local' space: origin at the viewer, -z is forward): shrink the whole
// world to a tabletop miniature, 0.8m in front of the viewer at chest height
renderer.xr.addEventListener('sessionstart', () => {
  world.scale.setScalar(0.15);
  world.position.set(0, -0.3, -0.8);
  setTimeout(summonWorld, 300); // once the headset pose is known, put it right in front of you
});
renderer.xr.addEventListener('sessionend', () => {
  world.scale.setScalar(1);
  world.position.set(0, 0, 0);
});

// ---------------------------------------------------------------- controllers (ZapBox etc.)
// trigger (hold) = grab the whole scene and move it with your hand
// grip/squeeze   = summon the scene to 0.5m in front of your face
// thumbstick     = up/down scales, left/right rotates
const controllers = [];
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  const ray = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: 0x7dd3fc }));
  ray.scale.z = 0.5;
  c.add(ray);
  c.addEventListener('connected', (e) => { c.userData.source = e.data; });
  c.addEventListener('disconnected', () => { c.userData.source = null; });
  c.addEventListener('selectstart', () => { if (!world.userData.grabbedBy) { c.attach(world); world.userData.grabbedBy = c; } });
  c.addEventListener('selectend', () => { if (world.userData.grabbedBy === c) { scene.attach(world); world.userData.grabbedBy = null; } });
  c.addEventListener('squeezestart', () => summonWorld());
  scene.add(c);
  controllers.push(c);
}
const _fwd = new THREE.Vector3(), _camPos = new THREE.Vector3();
function summonWorld() {
  if (world.userData.grabbedBy) { scene.attach(world); world.userData.grabbedBy = null; }
  const xrCam = renderer.xr.getCamera();
  xrCam.getWorldPosition(_camPos);
  xrCam.getWorldDirection(_fwd); _fwd.y = 0; _fwd.normalize();
  world.position.copy(_camPos).addScaledVector(_fwd, 0.5);
  world.position.y = _camPos.y - 0.35;
  world.rotation.set(0, Math.atan2(-_fwd.x, -_fwd.z), 0);
}
function pollSticks(dt) {
  for (const c of controllers) {
    const gp = c.userData.source && c.userData.source.gamepad;
    if (!gp || !gp.axes) continue;
    const x = gp.axes[2] ?? gp.axes[0] ?? 0, y = gp.axes[3] ?? gp.axes[1] ?? 0;
    if (Math.abs(y) > 0.5) world.scale.multiplyScalar(1 - y * dt * 1.2); // push up = bigger
    if (Math.abs(x) > 0.5) world.rotation.y -= x * dt * 1.5;
    const sc = THREE.MathUtils.clamp(world.scale.x, 0.03, 2);
    world.scale.setScalar(sc);
  }
}

// ---------------------------------------------------------------- loop / resize
const clock = new THREE.Clock();
const _camQ = new THREE.Quaternion(), _parentQ = new THREE.Quaternion();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  if (renderer.xr.isPresenting) pollSticks(dt);
  // active camera: XR headset camera while presenting, desktop camera otherwise
  const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
  cam.getWorldQuaternion(_camQ);
  for (const g of laptopGroups.values()) {
    g.updateWorldMatrix(true, false);
    g.getWorldQuaternion(_parentQ).invert();
    // billboard every text card (laptop label + agent cards) to face the camera
    if (g.userData.label) g.userData.label.quaternion.copy(_parentQ).multiply(_camQ);
    let j = 0;
    for (const card of g.userData.cards.values()) {
      card.quaternion.copy(_parentQ).multiply(_camQ);
      j++;
    }
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
