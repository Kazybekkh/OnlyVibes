<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnlyVibes Voice</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --accent:#4f8cff; --accent2:#2ea043; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:20px; font-weight:600; color:var(--dim); margin-bottom:24px; }
  #pad { width:120px; height:120px; border-radius:50%; border:3px solid var(--accent);
         background:#161b22; color:var(--fg); font-size:15px; cursor:pointer; user-select:none;
         touch-action:none; }
  #pad.holding { background:var(--accent); color:#fff; }
  #pad:disabled { opacity:.4; cursor:default; }
  .line { max-width:640px; width:90%; margin-top:18px; min-height:1.5em; }
  .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  #transcript { color:var(--fg); }
  #reply { color:var(--accent2); }
  #status { color:var(--dim); font-size:13px; margin-top:14px; min-height:1.2em; }
  #timings { color:var(--dim); font-size:12px; margin-top:6px; font-family:ui-monospace,monospace; }
</style>
</head>
<body>
  <h1>OnlyVibes Voice — Voxtral realtime</h1>
  <button id="pad" disabled>Hold to talk</button>
  <div class="line"><div class="label">You</div><div id="transcript"></div></div>
  <div class="line"><div class="label">Assistant</div><div id="reply"></div></div>
  <div id="status">starting…</div>
  <div id="timings"></div>

<script>
"use strict";
const STT_MODEL = "voxtral-mini-transcribe-realtime-3";
const TTS_MODEL = "voxtral-mini-tts-3-0";
const TTS_RATE = 48000;   // realtime pcm is 48kHz mono int16
const MIC_RATE = 16000;
const WS_BASE = "wss://api.mistral.ai/v1";

const pad = document.getElementById("pad");
const transcriptEl = document.getElementById("transcript");
const replyEl = document.getElementById("reply");
const statusEl = document.getElementById("status");
const timingsEl = document.getElementById("timings");

let micCtx = null, micStream = null, workletNode = null;
let sttWs = null, ttsWs = null;
let audioCtx = null, nextPlayTime = 0;
let holding = false, turnActive = false, t0 = 0, firstAudio = 0;
const history = [];

const status = (s) => { statusEl.textContent = s; };

async function mintToken(model) {
  const r = await fetch("/api/token", { method: "POST",
    headers: {"Content-Type":"application/json"}, body: JSON.stringify({model}) });
  if (!r.ok) throw new Error("token mint failed: " + await r.text());
  return (await r.json()).token;
}

// ---------- mic ----------
async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: {
    channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  micCtx = new AudioContext({ sampleRate: MIC_RATE });
  const src = micCtx.createMediaStreamSource(micStream);
  const workletUrl = URL.createObjectURL(new Blob([`
    class Pcm extends AudioWorkletProcessor {
      process(inputs) {
        const ch = inputs[0][0];
        if (ch) {
          const buf = new Int16Array(ch.length);
          for (let i = 0; i < ch.length; i++)
            buf[i] = Math.max(-32768, Math.min(32767, ch[i] * 32768));
          this.port.postMessage(buf.buffer, [buf.buffer]);
        }
        return true;
      }
    }
    registerProcessor("pcm", Pcm);`], { type: "application/javascript" }));
  await micCtx.audioWorklet.addModule(workletUrl);
  workletNode = new AudioWorkletNode(micCtx, "pcm");
  workletNode.port.onmessage = (e) => {
    if (holding && sttWs && sttWs.readyState === WebSocket.OPEN) {
      const b64 = btoa(String.fromCharCode(...new Uint8Array(e.data)));
      sttWs.send(JSON.stringify({ type: "input_audio.append", audio: b64 }));
    }
  };
  src.connect(workletNode).connect(micCtx.destination);
}

// ---------- STT websocket ----------
async function openStt() {
  const token = await mintToken(STT_MODEL);
  sttWs = new WebSocket(`${WS_BASE}/audio/transcriptions/realtime?model=${STT_MODEL}`,
                        ["realtime", token]);
  sttWs.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "transcription.text.delta") {
      transcriptEl.textContent += msg.text;
    } else if (msg.type === "transcription.done") {
      const text = (msg.text || transcriptEl.textContent).trim();
      sttWs.send(JSON.stringify({ type: "input_audio.end" }));
      if (text) runReply(text);
      else endTurn();
    } else if (msg.type === "error") {
      status("STT error: " + JSON.stringify(msg.error));
      endTurn();
    }
  };
  await new Promise((res, rej) => { sttWs.onopen = res; sttWs.onerror = rej; });
}

// ---------- TTS websocket ----------
async function openTts() {
  const token = await mintToken(TTS_MODEL);
  ttsWs = new WebSocket(`${WS_BASE}/audio/speech/realtime?model=${TTS_MODEL}`,
                        ["realtime", token]);
  ttsWs.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "speech.audio.delta") {
      if (!firstAudio) { firstAudio = performance.now();
        timingsEl.textContent = `first audio ${((firstAudio - t0)/1000).toFixed(2)}s`; }
      playPcm(atob(msg.audio_data));
    } else if (msg.type === "speech.audio.done") {
      // wait for audio to drain, then reset for next turn
      const drainMs = Math.max(0, (nextPlayTime - audioCtx.currentTime) * 1000);
      setTimeout(endTurn, drainMs + 150);
    } else if (msg.type === "error") {
      status("TTS error: " + JSON.stringify(msg.error)); endTurn();
    }
  };
  await new Promise((res, rej) => { ttsWs.onopen = res; ttsWs.onerror = rej; });
  ttsWs.send(JSON.stringify({ type: "session.update", session: {
    voice: "voice_592", response_format: "pcm", streaming_mode: "responsive" } }));
  await new Promise((res) => { ttsWs.onmessage = (ev) => {   // wait for session.updated
    const m = JSON.parse(ev.data); if (m.type === "session.updated") res(); } });
  // restore the real handler
  ttsWs.onmessage = ttsHandler;
}
function ttsHandler(ev) {
  const msg = JSON.parse(ev.data);
  if (msg.type === "speech.audio.delta") {
    if (!firstAudio) { firstAudio = performance.now();
      timingsEl.textContent = `first audio ${((firstAudio - t0)/1000).toFixed(2)}s`; }
    playPcm(atob(msg.audio_data));
  } else if (msg.type === "speech.audio.done") {
    const drainMs = Math.max(0, (nextPlayTime - audioCtx.currentTime) * 1000);
    setTimeout(endTurn, drainMs + 150);
  } else if (msg.type === "error") { status("TTS error: " + JSON.stringify(msg.error)); endTurn(); }
}

// ---------- audio playback (48k pcm int16) ----------
function playPcm(b64) {
  const bin = atob(b64);
  const samples = new Int16Array(bin.length / 2);
  for (let i = 0; i < samples.length; i++)
    samples[i] = (bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1) << 8)) << 16 >> 16;
  if (!audioCtx) audioCtx = new AudioContext();
  const buf = audioCtx.createBuffer(1, samples.length, TTS_RATE);
  buf.copyToChannel(samples, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  nextPlayTime = Math.max(nextPlayTime, now);
  src.start(nextPlayTime);
  nextPlayTime += buf.duration;
}

// ---------- chat (SSE via our server) ----------
async function runReply(userText) {
  history.push({ role: "user", content: userText });
  replyEl.textContent = "";
  await openTts();
  const r = await fetch("/api/chat", { method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ messages: [
      { role: "system", content: "You are a helpful voice assistant. Keep replies short and conversational." },
      ...history.slice(-20)] }) });
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buffer = "", full = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf("\n\n")) >= 0) {
      const line = buffer.slice(0, idx).trim(); buffer = buffer.slice(idx + 2);
      if (!line.startsWith("data:")) continue;
      const d = line.slice(5).trim();
      if (d === "[DONE]") continue;
      try {
        const obj = JSON.parse(d);
        const delta = obj.choices?.[0]?.delta?.content;
        if (delta) {
          full += delta;
          replyEl.textContent = full;
          if (ttsWs.readyState === WebSocket.OPEN)
            ttsWs.send(JSON.stringify({ type: "input_text.append", text: delta }));
        }
      } catch {}
    }
  }
  if (ttsWs.readyState === WebSocket.OPEN)
    ttsWs.send(JSON.stringify({ type: "input_text.flush" }));
  history.push({ role: "assistant", content: full });
  timingsEl.textContent += ` | total ${((performance.now() - t0)/1000).toFixed(2)}s`;
}

// ---------- turn control ----------
function endTurn() {
  holding = false; turnActive = false;
  pad.classList.remove("holding");
  pad.textContent = "Hold to talk";
  status("ready — hold the button (or SPACE) to talk");
}

async function beginTurn() {
  if (turnActive) return;
  turnActive = true; holding = true; firstAudio = 0; t0 = performance.now();
  transcriptEl.textContent = ""; replyEl.textContent = ""; timingsEl.textContent = "";
  pad.classList.add("holding"); pad.textContent = "Listening…";
  status("transcribing live…");
  if (!sttWs || sttWs.readyState !== WebSocket.OPEN) await openStt();
}

pad.addEventListener("pointerdown", (e) => { e.preventDefault(); pad.setPointerCapture(e.pointerId); beginTurn(); });
pad.addEventListener("pointerup", () => { if (holding && sttWs?.readyState === WebSocket.OPEN)
  sttWs.send(JSON.stringify({ type: "input_audio.end" })); });
window.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat) { e.preventDefault(); beginTurn(); } });
window.addEventListener("keyup", (e) => { if (e.code === "Space" && sttWs?.readyState === WebSocket.OPEN)
  sttWs.send(JSON.stringify({ type: "input_audio.end" })); });

(async () => {
  try {
    await startMic();
    pad.disabled = false;
    status("ready — hold the button (or SPACE) to talk");
  } catch (e) {
    status("mic error: " + e.message + " (allow microphone in the browser prompt)");
  }
})();
</script>
</body>
</html>
