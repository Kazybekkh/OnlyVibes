[project]
name = "onlyvibes"
version = "0.1.0"
description = "OnlyVibes: live AR/3D view of AI coding agents per laptop over Tailscale, plus a pluggable Voxtral voice interface"
requires-python = ">=3.11"
dependencies = [
    # reporter/
    "psutil>=6.1",
    "websockets>=14.0",
    # server/
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # voice/ (mic/speaker backends; API client itself is stdlib-only)
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.scripts]
onlyvibes-voice = "voice.__main__:main"
# server/reporter stay standalone: cd server && uv run uvicorn main:app --port 8000

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice/voice"]
